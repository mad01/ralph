name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install formatters
        run: make install_format_deps

      - name: Check formatting
        run: make format-check

      - name: Vet
        run: go vet ./...

      - name: Read pinned golangci-lint version
        id: tools
        run: echo "golangci-lint=$(make -s golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.tools.outputs.golangci-lint }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  integration:
    # The Docker suites take minutes, so they gate main rather than every PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run integration suites
        run: make test-integration
